[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-recursive-descent-ast-parser-skill"
version = "1.0.0"
description = "Recursive descent Abstract Syntax Tree (AST) parser supporting precedence climbing and JSON AST output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-recursive-descent-ast-parser-skill"
Repository = "https://github.com/alphaparkinc/genpark-recursive-descent-ast-parser-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-recursive-descent-ast-parser-skill/issues"
